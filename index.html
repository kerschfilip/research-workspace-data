<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Derived Text Formats</title>
<script>
  (function () {
    var saved = null, collapsed = null;
    try {
      saved = localStorage.getItem('dtf-theme');
      collapsed = localStorage.getItem('dtf-sidebar-collapsed');
    } catch (e) {}
    var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', saved || (sysDark ? 'dark' : 'light'));
    if (collapsed === '1') document.documentElement.setAttribute('data-sidebar', 'collapsed');
  })();
</script>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="design-system.css">
<script src="full-formats.js"></script>
<style>
/* Základ je v design/design-system.css. Sem patří jen věci specifické
   pro prohlížeč DTF. */
main { max-width: 1560px; }
/* Barvy webu ELC-DHLR (elc-dhlr.lib.cas.cz) místo modré digiscimap. */
:root { --blue: #425672; --blue-dark: #2f3e54; --blue-light: #e3e8ef; --flag: #425672; }
html[data-theme="dark"] { --blue: #a5b5ca; --blue-dark: #c8d3e1; --blue-light: #283246; --flag: #a5b5ca; }
/* Čtené texty drží rozumnou šířku, tabulky příkladu smějí doprava. */
section > p, section > ul.plain, section > dl.meta-list, section > .compare { max-width: 1060px; }
/* Značka v hlavičce místo vlajky digiscimap. */
.elc-mark { width: 34px; height: 34px; }
.elc-mark .m-c1 { fill: var(--blue); fill-opacity: 0.18; }
.elc-mark .m-c2 { fill: var(--blue); fill-opacity: 0.34; }
.elc-mark .m-line { fill: none; stroke: var(--blue); stroke-width: 4; stroke-linecap: round; }
.elc-mark .m-node { fill: var(--blue); }
.elc-mark .m-accent { fill: #c2a83e; }
.sidebar { width: 230px; }
.sidebar-section-label { margin-top: 24px; }
.sidebar-section-label:first-child { margin-top: 0; }

.lede { font-size: 17px; line-height: 1.6; max-width: 760px; margin: 0 0 var(--space-4); }
.status-row { display: flex; gap: var(--space-2); align-items: center; flex-wrap: wrap; margin: 0 0 var(--space-3); }
.tag.offered { border-color: var(--blue); color: var(--blue); }
.tag.not-offered { border-color: var(--muted); color: var(--muted); }

section h3 { margin-top: var(--space-5); }
.block-rule { border-top: 1px solid var(--line); padding-top: 14px; margin-top: var(--space-6); }

.params { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 0 0 var(--space-3); }
.param { min-width: 150px; }
.param label { margin-top: 8px; }
.param input[type=range] { width: 160px; accent-color: var(--blue); }
.param .range-value { font-variant-numeric: tabular-nums; font-size: 14px; margin-left: 8px; }

.example-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2.4fr); gap: var(--space-4); align-items: start; }
.source-pick { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-3); margin-bottom: var(--space-2); }
.source-pick select { width: auto; min-width: 0; max-width: 100%; font-size: 14px; }
.example-grid.even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.source-text p { font-family: var(--serif); font-size: 17px; line-height: 1.65; margin: 0 0 12px; }
.source-text .mark { background: var(--blue-light); box-shadow: 0 1px 0 var(--blue); }
.source-text .pos-tok { display: inline-flex; flex-direction: column; vertical-align: top; line-height: 1.25; margin: 0 4px 8px 0; }
.source-text .pos-tag { font-family: var(--mono); font-size: 10px; color: var(--muted); }
tr[data-pos-sel], tr[data-syn-sel] { cursor: pointer; }
tr[aria-selected="true"] td { background: var(--blue-light); }
.full-tabs { display: flex; flex-wrap: wrap; gap: 0 var(--space-4); border-bottom: 1px solid var(--hair); margin: var(--space-4) 0; }
.full-tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 0; font: inherit; color: var(--muted); cursor: pointer; }
.full-tabs button.active { color: var(--foreground); border-bottom-color: var(--blue); }
.full-md pre { white-space: pre; overflow-x: auto; }
.source-text .masked { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.source-text .recovered { background: var(--blue-light); }
/* Zkrácený text strany: pár řádků, zbytek po kliknutí na „Zobrazit více“. */
.source-text.clamped { max-height: 11em; overflow: hidden;
  -webkit-mask-image: linear-gradient(to bottom, #000 65%, transparent); mask-image: linear-gradient(to bottom, #000 65%, transparent); }
.text-toggle { margin: 4px 0 0; }
.page-meta { font-size: 13px; color: var(--muted); margin: 0 0 var(--space-3); }

.output-head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-3); margin-bottom: var(--space-2); }
.output-head .btn-row { margin: 0; }
.table-scroll { max-height: 460px; }
.table-scroll table { font-size: 13px; }
.table-scroll td, .table-scroll th { padding: 6px 14px 6px 0; white-space: nowrap; }
tr.current td { background: var(--soft); }
tr.current td:first-child { box-shadow: inset 3px 0 0 var(--blue); padding-left: 8px; }
td.num, th.num { text-align: right; }

.warn { display: flex; gap: 10px; align-items: baseline; font-size: 14px; margin: 0 0 var(--space-3); }
.warn::before { content: ""; width: 8px; height: 8px; flex: none; background: var(--orange); transform: translateY(-1px); }

.compare { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-5); }
.compare ol { margin: 0; padding-left: 20px; }
.compare li { margin-bottom: 6px; }
.pending { color: var(--muted); font-style: italic; }

.loader { padding: var(--space-6) 0; max-width: 420px; }
/* Značka z hlavičky v loaderu: kruhy pomalu „dýchají“, uzly se rozsvěcují postupně. */
.loader-mark { display: block; width: 72px; height: 72px; margin-bottom: var(--space-4); }
.loader-mark .m-c1, .loader-mark .m-c2 { animation: loader-breathe 1.6s ease-in-out infinite alternate; }
.loader-mark .m-c2 { animation-delay: .4s; }
.loader-mark .m-node, .loader-mark .m-accent { animation: loader-node 1.2s ease-in-out infinite; }
.loader-mark .m-node:nth-of-type(4) { animation-delay: .2s; }
.loader-mark .m-accent { animation-delay: .4s; }
@keyframes loader-breathe { from { fill-opacity: .08; } to { fill-opacity: .35; } }
@keyframes loader-node { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
.loader p { margin: var(--space-3) 0 0; color: var(--muted); font-size: 14px; }
.loader-bar { display: block; position: relative; height: 2px; background: var(--hair); overflow: hidden; }
.loader-bar::after { content: ""; position: absolute; top: 0; left: -35%; width: 35%; height: 100%; background: var(--blue); animation: loader-slide 1.1s ease-in-out infinite; }
@keyframes loader-slide { to { left: 100%; } }
.viewer-form { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: flex-end; margin: var(--space-2) 0; }
.viewer-form .param:first-child { min-width: 280px; }
table.viewer { max-width: 1060px; margin-top: var(--space-3); }
.viewer-chart { display: block; width: 100%; max-width: 1060px; height: auto; margin-top: var(--space-3); font-family: var(--sans); }
.viewer-chart .grid { stroke: var(--hair); }
.viewer-chart .axis { stroke: var(--foreground); }
.viewer-chart .tick { font-size: 12px; fill: var(--foreground); }
.viewer-chart .tick.muted { fill: var(--muted); }
.viewer-chart .series { font-size: 14px; font-weight: 600; }
.viewer-chart .cover { fill: var(--hair); }
.viewer-form .param:first-child { min-width: 420px; }
.vbar { display: inline-block; width: 220px; height: 10px; background: var(--soft); vertical-align: middle; margin-right: 8px; }
.vbar > span { display: block; height: 100%; background: var(--blue); }
.vbar.cover > span { background: var(--muted); }
/* Popup se schématem ZIPu (rámeček .box z design systému nad ztmaveným pozadím). */
.modal-backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(18, 18, 18, 0.45); display: flex; align-items: center; justify-content: center; padding: var(--space-4); }
.zip-modal { width: min(980px, 100%); max-height: calc(100vh - 64px); overflow: auto; }
.zip-modal .box-header { justify-content: space-between; }
.zip-tree { white-space: pre; overflow-x: auto; line-height: 1.7; }
.zip-tree .tree-note { color: var(--muted); }
pre.manifest { font-family: var(--mono); font-size: 12.5px; background: var(--soft); padding: 14px 16px; overflow: auto; margin: 0; }
ul.plain { padding-left: 20px; margin: 0 0 var(--space-3); }
ul.plain li { margin-bottom: 6px; }
/* Patička: zdroje v rozbalovací sekci, seznam zarovnaný vlevo. */
footer details.disclosure { max-width: 760px; margin: 18px auto 0; text-align: left; border-bottom: 1px solid var(--hair); }
footer details.disclosure > summary { justify-content: center; font-size: 11px; color: var(--muted); }
footer ol.sources { margin: 0; padding-left: 20px; font-size: 13px; line-height: 1.5; color: var(--muted); }
footer ol.sources li { margin-bottom: 6px; }
/* Metody: rozbalovací řádky, titulek jako běžný text (ne rubrika). */
details.method > summary { font-size: 15px; font-weight: 500; text-transform: none; letter-spacing: 0; }
details.method .disclosure-body { color: var(--muted); max-width: 760px; padding-left: 22px; }
/* Delší české názvy v menu se smějí zalomit. */
.sidebar-item { white-space: normal; }

@media (max-width: 860px) {
  .example-grid, .compare { grid-template-columns: 1fr; }
  main { padding: 24px 16px; }
}
</style>
</head>
<body>

<header>
  <div class="header-row">
    <span class="title-bar-rule"></span>
    <div class="title-row">
      <!-- Značka ELC-DHLR: překrývající se kruhy a síť uzlů podle hero webu
           elc-dhlr.lib.cas.cz, převedené do palety inkoust + modrá. -->
      <svg class="flag-logo elc-mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="40" cy="58" r="32" class="m-c1"/>
        <circle cx="64" cy="40" r="27" class="m-c2"/>
        <path d="M 24 72 L 50 50 L 74 30" class="m-line"/>
        <circle cx="24" cy="72" r="6" class="m-node"/>
        <circle cx="50" cy="50" r="6" class="m-node"/>
        <circle cx="74" cy="30" r="10" class="m-accent"/>
      </svg>
      <h1 id="wordmark">Derived text formats</h1>
    </div>
    <span class="title-bar-rule"></span>
    <div class="header-actions">
      <button class="chip" id="lang-toggle" type="button">CS</button>

    </div>

</header>

<div class="layout">
<aside class="sidebar" id="sidebar">
  <nav id="nav"></nav>
</aside>
<button class="sidebar-arrow" id="sidebar-toggle" type="button" title="Hide sidebar (Alt+S)">‹</button>

<main id="main"><div class="loader" role="status">
  <svg class="elc-mark loader-mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <circle cx="40" cy="58" r="32" class="m-c1"/>
    <circle cx="64" cy="40" r="27" class="m-c2"/>
    <path d="M 24 72 L 50 50 L 74 30" class="m-line"/>
    <circle cx="24" cy="72" r="6" class="m-node"/>
    <circle cx="50" cy="50" r="6" class="m-node"/>
    <circle cx="74" cy="30" r="10" class="m-accent"/>
  </svg>
  <span class="loader-bar"></span><p id="loader-text">Loading…</p></div></main>
</div>
<footer id="footer"></footer>

<script>
// ================================================================ jazyk

let LANG = 'en';
try { LANG = localStorage.getItem('dtf-lang') || ((navigator.language || '').startsWith('cs') ? 'cs' : 'en'); } catch (e) {}
const t = (en, cs) => LANG === 'cs' ? cs : en;

// ================================================================ parsing

// CoNLL-U → dokumenty / strany / odstavce / věty / tokeny.
function parseConllu(text) {
  const paragraphs = [];
  let par = null, sent = null;
  const newPar = () => { par = { sentences: [] }; paragraphs.push(par); };
  const endSent = () => { if (sent && sent.tokens.length) { if (!par) newPar(); par.sentences.push(sent); } sent = null; };
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim();
    if (!line) { endSent(); continue; }
    if (line.startsWith('#')) {
      if (/^#\s*newpar/.test(line)) { endSent(); newPar(); }
      const lm = line.match(/^#\s*lines\s*=\s*(\d+)/);
      if (lm) { if (!par) newPar(); par.lines = +lm[1]; }
      continue;
    }
    const c = line.includes('\t') ? line.split('\t') : line.split(/\s+/);
    if (c.length < 10 || /[-.]/.test(c[0])) continue; // víceslovné tokeny a prázdné uzly
    const feats = {};
    if (c[5] !== '_') c[5].split('|').forEach(kv => { const [k, v] = kv.split('='); feats[k] = v; });
    const ne = (c[9].match(/(?:^|\|)NE=([BI])-([^|]+)/) || []);
    if (!sent) sent = { tokens: [] };
    sent.tokens.push({
      id: +c[0], form: c[1], lemma: c[2], upos: c[3], feats,
      head: +c[6], deprel: c[7], neIob: ne[1] || null, neType: ne[2] || null,
      noSpace: /(?:^|\|)SpaceAfter=No(?:\||$)/.test(c[9])
    });
  }
  endSent();
  return paragraphs;
}

// Data (data.js, jednotky MB) se načítají až po prvním vykreslení stránky,
// aby byl mezitím vidět loader — viz boot() na konci.
let DATA = { documents: [] }, DOCS = [];
function loadDocs() {
  DATA = window.DTF_DATA || { documents: [] };
  DOCS = DATA.documents.map(d => ({
  id: d.id, title: d.title, year: d.year, articles: d.articles || [],
  model: d.model || '', date: d.date || '', issueNumber: d.issueNumber || '',
  volume: d.volume || {}, periodical: d.periodical || {}, provenance: d.provenance || {},
  metadataJson: d.metadataJson || null, mods: d.mods || null,
  // n = pořadí strany v dokumentu (pageIndex), number = tištěné číslo strany
  // (pageNumber z Krameria; když chybí, použije se pořadí).
  pages: d.pages.map((p, i) => withEntities({ n: i + 1, uuid: p.uuid || `${d.id}-p${i + 1}`, number: String(p.number != null ? p.number : (p.n != null ? p.n : i + 1)), type: p.type || '', paragraphs: parseConllu(p.conllu) }, p.entities))
  }));
}

// Všechny entity strany včetně vnořených (data.js: [typ, [pořadí tokenů na straně], základní tvar?]),
// s odstavcem prvního tokenu — stejně jako krakatit-plus lib/dtf_export.py.
function withEntities(pg, raw) {
  const flat = [];
  pg.paragraphs.forEach((par, pi) => par.sentences.forEach(s => s.tokens.forEach(tk => flat.push({ tk, pi }))));
  pg.entities = (raw || []).map(([type, ids, base]) => {
    const toks = ids.map(i => flat[i]).filter(Boolean);
    if (!toks.length) return null;
    const form = toks.map(x => x.tk.form).join(' ');
    return { type, pi: toks[0].pi, form, lemma: toks.map(x => x.tk.lemma).join(' '), base: base || form, n: toks.length };
  }).filter(Boolean);
  return pg;
}

// Plochý pohled: všechny věty s odkazem na dokument, stranu, odstavec.
function eachSentence(fn) {
  DOCS.forEach(d => d.pages.forEach(p => p.paragraphs.forEach((par, pi) =>
    par.sentences.forEach((s, si) => fn(s, d, p, pi, si)))));
}

const isPunct = tk => tk.upos === 'PUNCT';
// Ukázky exportů (DL4DH, RW, tento návrh) v repozitáři stránky.
const SAMPLES_URL = 'https://github.com/kerschfilip/research-workspace-data/tree/main/data-samples';
const POS_MAX_N = 5;
const posTag = (tk, tags) => tags === 'upos' || !tk.feats.Case ? tk.upos : tk.upos + ':' + tk.feats.Case;
function unitOf(tk, unit) {
  switch (unit) {
    case 'form': return tk.form;
    case 'lc': return tk.form.toLowerCase();
    case 'lemma': return tk.lemma;
    case 'lemma_pos': return tk.lemma + '_' + tk.upos;
    case 'upos': return tk.upos;
    case 'upos_case': return tk.feats.Case ? tk.upos + ':' + tk.feats.Case : tk.upos;
  }
  return tk.form;
}

// Entity z IOB značek v rámci jedné věty.
function entitiesOf(sent) {
  const out = [];
  let cur = null;
  sent.tokens.forEach(tk => {
    if (tk.neIob === 'B' || (tk.neIob === 'I' && (!cur || cur.type !== tk.neType))) {
      cur = { type: tk.neType, tokens: [tk] }; out.push(cur);
    } else if (tk.neIob === 'I') {
      cur.tokens.push(tk);
    } else cur = null;
  });
  return out;
}
// Typy entit NameTagu (CNEC 2.0): konkrétní typy mají vlastní popisek,
// ostatní dostanou popisek podle skupiny (první písmeno kódu) a kód v závorce.
const neLabel = type => {
  const exact = {
    P: t('person', 'osoba'), pf: t('first name', 'křestní jméno'), ps: t('surname', 'příjmení'),
    pd: t('title', 'titul'), gu: t('town', 'město'), gc: t('country', 'stát'),
    io: t('institution', 'instituce'), ic: t('cultural institution', 'kulturní instituce'),
    if: t('company', 'firma'), ty: t('year', 'rok'), T: t('date/time', 'datum/čas'),
    mn: t('periodical', 'periodikum'), C: t('bibliographic item', 'bibliografická položka')
  }[type];
  if (exact) return exact;
  const group = {
    p: t('person', 'osoba'), g: t('place', 'místo'), i: t('institution', 'instituce'),
    o: t('artefact', 'artefakt'), n: t('number', 'číslo'), t: t('time', 'čas'),
    m: t('media', 'média'), a: t('address', 'adresa')
  }[type[0].toLowerCase()];
  return group ? `${group} (${type})` : type;
};

// Deterministický pseudonáhodný generátor: stejný vstup → stejné číslo.
function hash01(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  h += h << 13; h ^= h >>> 7; h += h << 3; h ^= h >>> 17; h += h << 5;
  return ((h >>> 0) % 1000000) / 1000000;
}

function countInto(map, key, extra) {
  const e = map.get(key) || { count: 0, docs: new Set() };
  e.count++; if (extra) e.docs.add(extra);
  map.set(key, e);
}
// Řazení podle kódových bodů, ne podle locale: stejné pořadí jako v Pythonu
// (krakatit-plus lib/dtf_export.py), takže soubory vyjdou bajtově stejné.
const byCode = (x, y) => (x < y ? -1 : x > y ? 1 : 0);
const byCountThenKey = (a, b) => b[1].count - a[1].count || byCode(String(a[0]), String(b[0]));

// ================================================================ DTF definitions

// Texty se skládají při každém vykreslení, aby šel přepnout jazyk.
// Odkazy na kapitoly v Derived-Text-Formats-Overview.md (vault ELC-DHLR)
// jsou jen v komentářích: čtenář stránky ten dokument nemá.
function buildDtfs() {
  return [
  // Overview 3.1 + 3.2
  {
    key: 'terms', status: 'offered',
    title: t('Term counts', 'Počty slov'),
    gran: t('Paragraph*, article*, page, document', 'Odstavec*, článek*, strana, dokument'),
    lede: t('How often each word occurs in each unit: paragraph, article, page or document. Word order is discarded. This is the document-term matrix.',
            'Kolikrát se každé slovo vyskytuje v jednotce: odstavci, článku, straně nebo dokumentu. Pořadí slov se zahazuje. Jde o matici dokument–slovo.'),
    meta: [
      [t('Kept', 'Zůstává'), t('Vocabulary and frequencies per unit; at page level also the distribution of vocabulary across the document.', 'Slovník a četnosti v jednotce; na úrovni strany i rozložení slovníku v dokumentu.')],
      [t('Lost', 'Ztrácí se'), t('Word order, syntax, context, quotations. Nobody can read the text.', 'Pořadí slov, syntax, kontext, citace. Text si nikdo nepřečte.')],
      [t('Granularity', 'Granularita'), t('Chosen by the researcher: paragraph, article, page or document. Paragraph and article are offered only where they exist, and are still to be confirmed (see below).', 'Volí badatel: odstavec, článek, strana nebo dokument. Odstavec a článek jen tam, kde existují, a musíme je ještě potvrdit (viz níže).')],
      [t('Risk', 'Riziko'), t('Low at page level and above. Precedent: HathiTrust Extracted Features (per-page counts). What counts is the finest unit obtainable from the whole offer; an article is a sum of whole pages, so it adds nothing finer than a page.', 'Nízké od úrovně strany výš. Precedent: HathiTrust Extracted Features (počty po stranách). Rozhoduje nejjemnější jednotka, kterou lze z celé nabídky získat; článek je součet celých stran, takže nic jemnějšího než strana nepřidá.')]
    ],
    structure: [
      ['doc_uuid', 'string', t('Kramerius UUID of the document (issue or volume)', 'UUID dokumentu (čísla nebo svazku) v Krameriovi')],
      ['article_uuid', 'string', t('Kramerius UUID of the article; only at article level', 'UUID článku v Krameriovi; jen na úrovni článku')],
      ['pageIndex', 'integer', t('Order of the page in the document (1, 2, 3 …); at page and paragraph level', 'Pořadí strany v dokumentu (1, 2, 3 …); na úrovni strany a odstavce')],

const CONTENT_POS = new Set(['NOUN', 'PROPN', 'ADJ', 'VERB', 'ADV', 'NUM']);
function maskDecision(tk, d, pg, pi, si, p, seed) {
  const eligible = p.mode === 'random' ? !isPunct(tk) : CONTENT_POS.has(tk.upos);
  if (!eligible) return { eligible: false, masked: false };
  const r = hash01([seed, d.id, pg.n, pi, si, tk.id].join('|'));
  return { eligible: true, masked: r < p.ratio / 100 };
}

function entityTypes() {
  const s = new Set();
  DOCS.forEach(d => d.pages.forEach(pg => pg.entities.forEach(e => s.add(e.type))));
  return [...s].sort(byCode);
}

// Specifikace plných formátů z full-formats/*.md (full-formats.js, build_full_formats.py),
// jedna záložka na soubor, česky (*.cs.md) nebo anglicky (*.md) podle přepínače jazyka.
function mdInline(text) {
  return esc(text)
    .replace(/`([^`]+)`/g, (m, c) => `<code>${c}</code>`)
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, label, href) =>
      `<a href="${/^(https?:|#)/.test(href) ? href : 'full-formats/' + href}"${/^https?:/.test(href) ? ' target="_blank" rel="noopener"' : ''}>${label}</a>`);
}
function mdCells(line) {
  return line.trim().replace(/^\||\|$/g, '').split(/(?<!\\)\|/).map(c => mdInline(c.trim().replace(/\\\|/g, '|')));
}
function mdToHtml(md) {
  const lines = md.replace(/\r/g, '').split('\n'), out = [];
  for (let i = 0; i < lines.length;) {
    const line = lines[i];
    if (line.startsWith('```')) {
      const code = [];
      for (i++; i < lines.length && !lines[i].startsWith('```'); i++) code.push(lines[i]);
      out.push(`<pre class="manifest">${esc(code.join('\n'))}</pre>`); i++; continue;
    }
    if (/^#\s/.test(line)) { i++; continue; }
    if (/^##\s/.test(line)) { out.push(`<h3 class="block-rule">${mdInline(line.slice(3))}</h3>`); i++; continue; }
    if (/^###\s/.test(line)) { out.push(`<p class="rubric">${mdInline(line.slice(4))}</p>`); i++; continue; }
    if (line.startsWith('|') && /^\|[\s:|-]+\|$/.test((lines[i + 1] || '').trim())) {
      const head = mdCells(line); const rows = [];
      for (i += 2; i < lines.length && lines[i].startsWith('|'); i++) rows.push(mdCells(lines[i]));
      out.push(`<table><thead><tr>${head.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`);
      continue;
    }
    if (/^\s*- /.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*- /.test(lines[i])) {
        let item = lines[i].replace(/^\s*- /, ''); i++;
        while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*- /.test(lines[i])) { item += ' ' + lines[i].trim(); i++; }
        items.push(`<li>${mdInline(item)}</li>`);
      }
      out.push(`<ul>${items.join('')}</ul>`); continue;
    }
    if (!line.trim()) { i++; continue; }
    const para = [];
    while (i < lines.length && lines[i].trim() && !/^(#|```|\||\s*- )/.test(lines[i])) para.push(lines[i++]);
    out.push(`<p>${mdInline(para.join(' '))}</p>`);
  }
  return out.join('\n');
}

function paramControl(dtf, p) {
  const v = state.params[dtf.key][p.id], name = `${dtf.key}-${p.id}`;
  let ctl = '';
  if (p.type === 'select') {
    const opts = typeof p.options === 'function' ? p.options() : p.options;
    ctl = `<select id="${name}" data-dtf="${dtf.key}" data-param="${p.id}">${opts.map(([val, lab]) => `<option value="${esc(val)}"${String(v) === String(val) ? ' selected' : ''}>${esc(lab)}</option>`).join('')}</select>`;
  } else if (p.type === 'number') {
    ctl = `<input type="number" id="${name}" data-dtf="${dtf.key}" data-param="${p.id}" value="${v}" min="${p.min}" max="${p.max}">`;
  } else if (p.type === 'text') {
    ctl = `<input type="text" id="${name}" data-dtf="${dtf.key}" data-param="${p.id}" value="${esc(v)}" placeholder="${esc(p.placeholder || '')}">`;
  } else if (p.type === 'range') {
    ctl = `<input type="range" id="${name}" data-dtf="${dtf.key}" data-param="${p.id}" value="${v}" min="${p.min}" max="${p.max}" step="${p.step || 1}"><span class="range-value">${v}</span>`;
  } else if (p.type === 'checkbox') {
    return `<div class="param"><label for="${name}">${esc(p.label)}</label><span class="checkbox-row"><input type="checkbox" id="${name}" data-dtf="${dtf.key}" data-param="${p.id}"${v ? ' checked' : ''}> ${esc(p.text || '')}</span></div>`;
  }
  return `<div class="param"><label for="${name}">${esc(p.label)}</label>${ctl}</div>`;
}

// Text strany; markFn(tk) zvýrazní tokeny, které formát zachovává.
function pageText(markFn, tokenHtml) {
  const d = currentDoc(), pg = currentPage();
  if (!pg) return `<p class="empty">${t('No data', 'Žádná data')}</p>`;
  // Mezery podle SpaceAfter=No z UDPipe; data bez něj (ruční demo) lepí jen interpunkci.
  const spaceInfo = pg.paragraphs.some(par => par.sentences.some(s => s.tokens.some(tk => tk.noSpace)));
  return pg.paragraphs.map((par, pi) => '<p>' + par.sentences.map((s, si) => s.tokens.map((tk, i) => {
    const space = i === 0 || (spaceInfo ? s.tokens[i - 1].noSpace : isPunct(tk)) ? '' : ' ';
    const html = tokenHtml ? tokenHtml(tk, d, pg, pi, si) : (markFn && markFn(tk) ? `<span class="mark">${esc(tk.form)}</span>` : esc(tk.form));
    return space + html;
  }).join('')).join(' ') + '</p>').join('');
}

// UUID se v tabulce zkrátí na začátek a konec (celé v title); ve staženém souboru je celé.
const cellHtml = v => /^uuid:[0-9a-z-]{20,}$/i.test(String(v))
  ? `<span title="${esc(v)}">${esc(String(v).slice(5, 13))}…${esc(String(v).slice(-4))}</span>` : esc(v);

function tableHtml(res) {
  const num = res.numeric || (() => false);
  const pi = res.columns.indexOf('pageIndex');
  const isCurrent = res.isCurrent || (r => r[0] === state.doc && (pi < 0 || r[pi] === '' || String(r[pi]) === String(state.page)));
  const hasDoc = !!res.isCurrent || res.columns[0] === 'doc_uuid';
  // Řádky vybrané strany napřed, ať jsou vidět i u velkých dat; pořadí uvnitř skupin zůstává.
  const ordered = hasDoc ? [...res.rows.filter(r => isCurrent(r)), ...res.rows.filter(r => !isCurrent(r))] : res.rows;
  const max = 300, rows = ordered.slice(0, max);
  return `<div class="table-scroll"><table><thead><tr>${res.columns.map((c, i) => `<th${num(i) ? ' class="num"' : ''}>${esc(c)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr${hasDoc && isCurrent(r) ? ' class="current"' : ''}${res.rowAttr ? res.rowAttr(r) : ''}>${r.map((v, i) => `<td${num(i) ? ' class="num"' : ''}>${cellHtml(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    ${res.rows.length > max ? `<p class="hint">${t(`Showing ${max} of ${res.rows.length} rows. The download has all of them.`, `Zobrazeno ${max} z ${res.rows.length} řádků. Ke stažení jsou všechny.`)}</p>` : ''}
    ${res.rows.length === 0 ? `<p class="empty">${t('No rows at these parameters', 'Při těchto parametrech žádné řádky')}</p>` : ''}`;
}

// SHA-256 (FIPS 180-4) bez crypto.subtle, které na file:// nemusí být k dispozici.
function sha256(text) {
  const bytes = new TextEncoder().encode(text);
  const K = [0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5, 0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3,
    0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174, 0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
    0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967, 0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13,
    0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85, 0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
    0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3, 0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208,
    0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2];
  const H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
  const len = bytes.length, total = ((len + 9 + 63) >> 6) << 6;
  const msg = new Uint8Array(total); msg.set(bytes); msg[len] = 0x80;
  const view = new DataView(msg.buffer);
  view.setUint32(total - 8, Math.floor(len / 0x20000000)); view.setUint32(total - 4, (len << 3) >>> 0);
  const w = new Uint32Array(64), rotr = (x, n) => (x >>> n) | (x << (32 - n));
  for (let off = 0; off < total; off += 64) {
    for (let i = 0; i < 16; i++) w[i] = view.getUint32(off + i * 4);
    for (let i = 16; i < 64; i++) {
      const s0 = rotr(w[i - 15], 7) ^ rotr(w[i - 15], 18) ^ (w[i - 15] >>> 3), s1 = rotr(w[i - 2], 17) ^ rotr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
      w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0;
    }
    let [a, b, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const t1 = (h + (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) >>> 0;
      const t2 = ((rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    [a, b, c, d, e, f, g, h].forEach((x, i) => { H[i] = (H[i] + x) >>> 0; });
  }
  return H.map(x => x.toString(16).padStart(8, '0')).join('');
}

// Co se s textem stalo — anglicky, protože manifest je pro mezinárodní použití.
function provenanceLines(d) {
  const ocr = (d.provenance.ocr || []).map(o => o.engine + (o.version ? ' ' + o.version : '')).join(', ') || 'unknown OCR';
  return [
    `Text recognised by OCR (${ocr}) from the page scans.`,
    `Tokenised, lemmatised and tagged with UDPipe (${(DATA.enrichment || {}).udpipe || 'unknown model'}).`
  ];
}

function transformationsFor(dtf, gran, d) {
  return [
    ...provenanceLines(d),
    'Word order discarded: only counts of (form, lemma, upos) per unit are kept.',
    `Counts are per ${gran}.` + (gran === 'paragraph' ? ' Paragraphs are ALTO TextBlocks.' : gran === 'article' ? ' An article is the sum of the whole pages it appears on.' : ' Nothing finer than a page is released.'),
    'Original case preserved; punctuation kept as rows with upos = PUNCT; no frequency threshold applied.',
    'The full text is not part of this package and cannot be reconstructed from it.'
  ];
}

function docManifest(dtf, d, gran, checksums) {
  const base = (DATA.kramerius || '').replace(/\/$/, '');
  return {
    format: 'dtf/' + dtf.key,
    format_version: '0.1-draft',
    granularity: gran,
    columns: dtf.compute(zipParams(dtf, gran)).columns,
    doc_uuid: d.id,
    source: {
      kramerius: base || null,
      url: base ? `${base}/view/${d.id}` : null,
      citation: `${d.title || (d.issueNumber ? 'Issue ' + d.issueNumber : d.id)}${d.date ? ', ' + d.date : ''}. Kramerius, ${d.id}.`
    },
    provenance: {
      ocr: d.provenance.ocr || [],
      enrichment: DATA.enrichment || {},
      enriched_at: d.provenance.enrichedAt || null,
      intermediate_format_version: 'demo'
    },
    generator: { name: 'ELC-DHLR DTF prototype', version: '0.1-draft' },
    licence: {
      data: 'TBD',
      metadata: 'TBD',
      note: 'To be resolved: licence of the derived data and of the Kramerius metadata, and whether the licence of the UDPipe model (CC BY-NC-SA) carries over to derived counts.'
    },
    transformations: dtf.transformations ? dtf.transformations(gran, d) : transformationsFor(dtf, gran, d),
    encoding: 'CSV, UTF-8, comma-separated, header row',
    checksums,
    ...(dtf.manifestExtra ? dtf.manifestExtra(d, gran) : {})
  };
}

// Soubory jedné složky dokumentu; manifest vzniká až nakonec, protože nese
// kontrolní součty ostatních souborů (sám sebe nepočítá).
function docFolderFiles(dtf, d, gran) {
  const res = dtf.compute(zipParams(dtf, gran));
  const folder = d.id.replace(/^uuid:/, '') + '/';
  // metadata.json a mods.xml jako v plném exportu (full-formats/metadata.md).
  const files = [[folder + 'metadata.json', JSON.stringify(d.metadataJson, null, 2) + '\n']];
  if (d.mods) files.push([folder + 'mods.xml', d.mods]);
  files.push(
    [folder + 'pages.csv', csvText([['doc_uuid', 'pageIndex', 'page_uuid', 'pageNumber', 'pageType'], ...d.pages.map(p => [d.id, p.n, p.uuid, p.number, p.type])])]
  );
  if ((d.articles || []).length) files.push([folder + 'articles.csv', csvText([['article_uuid', 'doc_uuid', 'title', 'authors', 'pages'],
    ...d.articles.map(a => [a.id, d.id, a.title, a.authors || '', a.pages.join('|')])])]);
  files.push([folder + dtf.key + '.csv', csvText([res.columns, ...res.rows.filter(r => r[0] === d.id)])]);
  const checksums = Object.fromEntries(files.map(([name, text]) => [name.slice(folder.length), 'sha256:' + sha256(text)]));
  return [[folder + 'manifest.json', JSON.stringify(docManifest(dtf, d, gran, checksums), null, 2) + '\n'], ...files];
}

// Raw deflate přes CompressionStream; prohlížeč bez něj zabalí bez komprese.
async function deflateRaw(bytes) {
  if (typeof CompressionStream === 'undefined') return null;
  const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

// Minimální zip (deflate, jinak „stored“) s pevným datem. Obsah souborů je
// stejný jako z krakatit-plus; bajty samotného ZIPu se mohou lišit (jiná
// implementace deflate), proto se shoda ověřuje na souborech, ne na ZIPu.
async function makeZip(files) {
  const enc = new TextEncoder(), table = [];
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; table[n] = c >>> 0; }
  const crc32 = b => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = table[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  const parts = [], central = [];
  let offset = 0;
  for (const [name, text] of files) {
    const nb = enc.encode(name), raw = enc.encode(text), crc = crc32(raw);
    const packed = await deflateRaw(raw), method = packed ? 8 : 0, db = packed || raw;
    const head = new DataView(new ArrayBuffer(30));
    [[0, 0x04034b50, 4], [4, 20, 2], [6, 0x0800, 2], [8, method, 2], [10, 0, 2], [12, 0x0021, 2], [14, crc, 4], [18, db.length, 4], [22, raw.length, 4], [26, nb.length, 2], [28, 0, 2]]
      .forEach(([o, v, s]) => s === 4 ? head.setUint32(o, v, true) : head.setUint16(o, v, true));
    const cd = new DataView(new ArrayBuffer(46));
    [[0, 0x02014b50, 4], [4, 20, 2], [6, 20, 2], [8, 0x0800, 2], [10, method, 2], [12, 0, 2], [14, 0x0021, 2], [16, crc, 4], [20, db.length, 4], [24, raw.length, 4], [28, nb.length, 2], [30, 0, 2], [32, 0, 2], [34, 0, 2], [36, 0, 2], [38, 0, 4], [42, offset, 4]]
      .forEach(([o, v, s]) => s === 4 ? cd.setUint32(o, v, true) : cd.setUint16(o, v, true));
    parts.push(head, nb, db); central.push(cd, nb);
    offset += 30 + nb.length + db.length;
  }
  const cdSize = central.reduce((a, x) => a + x.byteLength, 0);
  const end = new DataView(new ArrayBuffer(22));
  [[0, 0x06054b50, 4], [8, files.length, 2], [10, files.length, 2], [12, cdSize, 4], [16, offset, 4]]
    .forEach(([o, v, s]) => s === 4 ? end.setUint32(o, v, true) : end.setUint16(o, v, true));
  return new Blob([...parts, ...central, end], { type: 'application/zip' });
}

// download.json: kdy a odkud se balíček stáhl. Mimo kontrolní součty
// manifestů, jediný soubor, ve kterém se dvě stažení týchž dat liší.
function downloadJson(dtf, name) {
  const p = state.params[dtf.key];
  const info = {
    downloaded_at: new Date().toISOString().replace(/\.\d{3}Z$/, 'Z'),
    package: name,
    format: 'dtf/' + dtf.key,
    parameters: dtf.selection ? dtf.selection.parameters(p) : { granularity: p.gran },
    documents: DOCS.length,
    source: { kramerius: (DATA.kramerius || '').replace(/\/$/, '') || null },
    note: 'Not covered by the checksums in the manifests: the only file that differs between two downloads of the same data.'
  };
  return ['download.json', JSON.stringify(info, null, 2) + '\n'];
}

async function downloadZip(dtf) {
  const gran = state.params[dtf.key].gran;
  const name = dtf.selection ? dtf.selection.zipName(state.params[dtf.key]) : `dtf_${dtf.key}_${gran}.zip`;
  const files = dtf.selection ? selectionFiles(dtf) : DOCS.flatMap(d => docFolderFiles(dtf, d, gran));
  const blob = await makeZip([...files, downloadJson(dtf, name)]);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// Výběrové formáty (n-gramy slov, syntaktické n-gramy): jeden ZIP za celý
// výběr — manifest.json, metadata.csv a <formát>.csv —, stejně jako
// krakatit-plus lib/dtf_export.py (ngram_files, syntactic_files).
const MIN_WORDS = 200000;
function selectionFiles(dtf) {
  const p = state.params[dtf.key], sel = dtf.selection, res = dtf.compute(p);
  let words = 0;
  eachSentence(s => s.tokens.forEach(tk => { if (!isPunct(tk)) words++; }));
  const pages = DOCS.reduce((a, d) => a + d.pages.length, 0), minDocs = 10 * p.k;
  const met = DOCS.length >= minDocs && words >= MIN_WORDS;
  const files = [
    ['metadata.csv', csvText([
      ['doc_uuid', 'model', 'title', 'date', 'issue_number', 'volume_uuid', 'volume_number', 'volume_year', 'periodical_uuid', 'periodical_title'],
      ...DOCS.map(d => { const v = d.volume || {}, pr = d.periodical || {}; return [d.id, d.model, d.title, d.date, d.issueNumber, v.uuid || '', v.number || '', v.year || '', pr.uuid || '', pr.title || '']; })])],
    [dtf.key + '.csv', csvText([res.columns, ...res.rows])]
  ];
  const ocr = [...new Map(DOCS.flatMap(d => d.provenance.ocr || []).map(o => [o.engine + '\u0001' + (o.version || ''), o])).values()]
    .sort((a, b) => byCode(a.engine, b.engine) || byCode(a.version || '', b.version || ''));
  const ocrText = [...new Set(ocr.map(o => o.engine + (o.version ? ' ' + o.version : '')))].sort(byCode).join(', ') || 'unknown OCR';
  const manifest = {
    format: 'dtf/' + dtf.key,
    format_version: '0.1-draft',
    parameters: sel.parameters(p),
    conditions: { ...sel.conditions(p), min_documents: minDocs, min_words: MIN_WORDS, met },
    selection: { documents: DOCS.length, pages, words, doc_uuids: DOCS.map(d => d.id) },
    source: { kramerius: (DATA.kramerius || '').replace(/\/$/, '') || null },
    provenance: { ocr: ocr.map(o => ({ engine: o.engine, version: o.version || '' })), enrichment: DATA.enrichment || {},
      enriched_at: DOCS.map(d => d.provenance.enrichedAt).filter(Boolean).sort(byCode).pop() || null, intermediate_format_version: 'demo' },
    generator: { name: 'ELC-DHLR DTF prototype', version: '0.1-draft' },
    licence: {
      data: 'TBD',
      metadata: 'TBD',
      note: 'To be resolved: licence of the derived data and of the Kramerius metadata, and whether the licence of the UDPipe model (CC BY-NC-SA) carries over to derived counts.'
    },
    transformations: [
      `Text recognised by OCR (${ocrText}) from the page scans.`,
      `Tokenised, lemmatised and tagged with UDPipe (${(DATA.enrichment || {}).udpipe || 'unknown model'}).`,
      ...sel.transformations(p),
      'The full text is not part of this package and cannot be reconstructed from it.',
      ...(met ? [] : ['WARNING: the selection does not meet the download conditions; generated for testing only, not for publication.'])
    ],
    encoding: 'CSV, UTF-8, comma-separated, header row',
    checksums: Object.fromEntries(files.map(([name, text]) => [name, 'sha256:' + sha256(text)]))
  };
  return [['manifest.json', JSON.stringify(manifest, null, 2) + '\n'], ...files];
}

function manifestFor(dtf) {
  if (dtf.selection) return JSON.parse(selectionFiles(dtf)[0][1]);
  if (dtf.zip) return JSON.parse(docFolderFiles(dtf, currentDoc(), state.params[dtf.key].gran)[0][1]);
  return {
    format: 'dtf/' + dtf.key,
    format_version: '0.1-draft',
    parameters: state.params[dtf.key],
    sources: DOCS.map(d => ({ id: d.id, title: d.title, year: d.year, pages: d.pages.length })),
    enrichment: DATA.enrichment || {},
    encoding: 'CSV, UTF-8, comma-separated, header row',
    generated: 'deterministic: same sources, parameters and models give the same bytes'
  };
}

function renderMaskingExample() {
  const p = state.params.masking;
  let elig = 0, a = 0, union = 0;
  const decide = (tk, d, pg, pi, si) => ({
    A: maskDecision(tk, d, pg, pi, si, p, p.seed),
    B: maskDecision(tk, d, pg, pi, si, p, p.seed + 1)
  });
  eachSentence((s, d, pg, pi, si) => s.tokens.forEach(tk => {
    const { A, B } = decide(tk, d, pg, pi, si);
    if (!A.eligible) return;
    elig++; if (!A.masked) a++; if (!A.masked || !B.masked) union++;
  }));
  const pct = x => elig ? Math.round(100 * x / elig) + ' %' : '-';
  const one = pageText(null, (tk, d, pg, pi, si) => decide(tk, d, pg, pi, si).A.masked ? `<span class="masked">${tk.upos}</span>` : esc(tk.form));
  const combined = pageText(null, (tk, d, pg, pi, si) => {
    const { A, B } = decide(tk, d, pg, pi, si);
    if (A.masked && B.masked) return `<span class="masked">${tk.upos}</span>`;
    if (A.masked && !B.masked) return `<span class="recovered">${esc(tk.form)}</span>`;
    return esc(tk.form);
  });
  return `
    ${sourcePicker()}
    <div class="example-grid even">
      <div>
        <p class="rubric">${t('Original', 'Originál')}</p>
        ${sourceBlock(pageText(null))}
      </div>
      <div>
        <p class="rubric">${t('Masked, seed', 'Zamaskováno, seed')} ${p.seed}</p>
        ${sourceBlock(one)}
        ${p.second ? `<p class="rubric" style="margin-top:24px">${t(`Seed ${p.seed} combined with seed ${p.seed + 1}`, `Seed ${p.seed} spojený se seedem ${p.seed + 1}`)}</p>
          ${sourceBlock(combined)}
          <p class="hint">${t('Highlighted: words hidden by the first masking and revealed by the second.', 'Zvýrazněno: slova skrytá prvním maskováním, která odkrylo druhé.')}</p>` : ''}
      </div>
    </div>
    <dl class="meta-list">
      <dt>${t('Visible after one masking', 'Viditelné po jednom maskování')}</dt><dd>${pct(a)} ${p.mode === 'content' ? t('of content words', 'plnovýznamových slov') : t('of words', 'slov')}</dd>
      ${p.second ? `<dt>${t('Visible after two maskings', 'Viditelné po dvou maskováních')}</dt><dd>${pct(union)}</dd>` : ''}
    </dl>`;
}

function renderDtf(dtf) {

// ---------------------------------------------------------------- ukázka prohlížeče n-gramů
// Na ukázkových datech je jen rok 1905, proto osa ukazuje čísla místo let.
// Práh je v ukázce nižší (3) než navržených 5, jinak by neprošlo nic.
const VIEWER_K = 3;
const MAX_ENTITY_TOKENS = 10;
// „Jména“ v CNEC 2.0: osoby, místa, instituce, média a pojmenované objekty;
// ne čísla, časy, míry, měny a bibliografické citace.
const isNameType = type => /^[Ppgim]/.test(type) || ['oa', 'op', 'or', 'o_'].includes(type);
let viewerSeqCache = null;
function viewerSequences(unit) {
  if (viewerSeqCache && viewerSeqCache.unit === unit) return viewerSeqCache.docs;
  const docs = DOCS.map(d => ({ d, sents: [], words: 0 }));
  const byId = new Map(docs.map(x => [x.d.id, x]));
  eachSentence((s, d) => {
    const toks = s.tokens.filter(tk => !isPunct(tk)).map(tk => unit === 'lemma' ? tk.lemma.toLowerCase() : tk.form.toLowerCase());
    const x = byId.get(d.id); x.sents.push(toks); x.words += toks.length;
  });
  viewerSeqCache = { unit, docs };
  return docs;
}

// Návrhy dotazů: dvojice podstatných a přídavných jmen, které prahem projdou.
function viewerSuggestions(unit) {
  const m = new Map(), CONTENT = new Set(['NOUN', 'ADJ', 'PROPN']);
  const key = tk => unit === 'lemma' ? tk.lemma.toLowerCase() : tk.form.toLowerCase();
  eachSentence((s, d) => {
    const toks = s.tokens.filter(tk => !isPunct(tk));
    for (let i = 0; i + 2 <= toks.length; i++) {
      const [x, y] = [toks[i], toks[i + 1]];
      if (!CONTENT.has(x.upos) || !CONTENT.has(y.upos) || !/^\p{L}{3,}$/u.test(x.form) || !/^\p{L}{3,}$/u.test(y.form)) continue;
      countInto(m, key(x) + ' ' + key(y), d.id);
    }
  });
  return [...m].filter(([, e]) => e.docs.size >= VIEWER_K).sort(byCountThenKey).slice(0, 8).map(([g]) => g);
}

// Řady grafu: modrá a inkoust, plné a čárkované — paleta design systému
// nemá další barvy, popisek na konci čáry řadu pojmenuje.
const VIEWER_SERIES = [
  { color: 'var(--blue)', dash: '' }, { color: 'var(--foreground)', dash: '' },
  { color: 'var(--blue)', dash: '6 4' }, { color: 'var(--foreground)', dash: '6 4' }, { color: 'var(--muted)', dash: '2 3' }
];

function viewerChart(docs, series) {
  const W = 920, H = 340, L = 78, R = 170, T = 16, B = 104, plotH = H - T - B, plotW = W - L - R;
  const n = docs.length, x = i => L + (n === 1 ? plotW / 2 : i * plotW / (n - 1));
  const maxY = Math.max(...series.flatMap(s => s.values)) || 1;
  const nice = (() => { const e = Math.pow(10, Math.floor(Math.log10(maxY))); return [1, 2, 2.5, 5, 10].map(m => m * e).find(v => v >= maxY); })();
  const y = v => T + plotH - (v / nice) * plotH;
  const pct = v => (v * 100).toLocaleString(LANG === 'cs' ? 'cs-CZ' : 'en-GB', { maximumSignificantDigits: 3 }) + ' %';
  const ticks = [0, 0.25, 0.5, 0.75, 1].map(f => f * nice);
  const maxWords = Math.max(...docs.map(x => x.words)) || 1, covTop = H - 44, covH = 26;
  // Popisky na konci čar posunout, ať se nepřekrývají.
  const ends = series.map((s, i) => ({ i, y: y(s.values[n - 1]) })).sort((a, b) => a.y - b.y);
  ends.forEach((e, j) => { if (j && e.y - ends[j - 1].y < 19) e.y = ends[j - 1].y + 19; });
  const labelY = Object.fromEntries(ends.map(e => [e.i, e.y]));
  return `<svg class="viewer-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('Relative frequency by issue', 'Relativní četnost po číslech')}">
    ${ticks.map(v => `<line x1="${L}" x2="${L + plotW}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${L - 8}" y="${y(v) + 4}" class="tick" text-anchor="end">${pct(v)}</text>`).join('')}
    <line x1="${L}" x2="${L + plotW}" y1="${T + plotH}" y2="${T + plotH}" class="axis"/>
    ${docs.map((d, i) => `<text x="${x(i)}" y="${T + plotH + 18}" class="tick" text-anchor="middle">${esc(d.d.issueNumber ? t('Issue ', 'Č. ') + d.d.issueNumber : String(i + 1))}</text>
      <text x="${x(i)}" y="${T + plotH + 32}" class="tick muted" text-anchor="middle">${esc(d.d.date || '')}</text>
      <rect x="${x(i) - 14}" y="${covTop + covH - covH * d.words / maxWords}" width="28" height="${covH * d.words / maxWords}" class="cover"><title>${d.words} ${t('words', 'slov')}, ${d.d.pages.length} ${t('pages', 'stran')}</title></rect>`).join('')}
    <text x="${L - 22}" y="${covTop + covH - 4}" class="tick muted" text-anchor="end">${t('coverage', 'pokrytí')}</text>
    ${series.map((s, k) => {
      const st = VIEWER_SERIES[k % VIEWER_SERIES.length];
      const pts = s.values.map((v, i) => `${x(i)},${y(v)}`).join(' ');
      return `<polyline points="${pts}" fill="none" stroke="${st.color}" stroke-width="2" stroke-dasharray="${st.dash}" stroke-linejoin="round"/>
        ${s.values.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="${st.color}"><title>${esc(s.label)}: ${pct(v)} (${s.counts[i]}×)</title></circle>`).join('')}
        <text x="${L + plotW + 10}" y="${labelY[k] + 4}" class="series" fill="${st.color}">${esc(s.label)}</text>`;
    }).join('')}
  </svg>`;
}

function ngramViewerHtml() {
  const v = state.viewer || (state.viewer = { q: '', unit: 'lemma' });
  const fmt = x => x.toLocaleString(LANG === 'cs' ? 'cs-CZ' : 'en-GB', { maximumFractionDigits: 0 });
  const docs = viewerSequences(v.unit).slice().sort((a, b) => String(a.d.date).localeCompare(String(b.d.date)) || (+a.d.issueNumber || 0) - (+b.d.issueNumber || 0));
  const pages = DOCS.reduce((a, d) => a + d.pages.length, 0), words = docs.reduce((a, x) => a + x.words, 0);
  const suggestions = viewerSuggestions(v.unit);
  const phrases = v.q.split(',').map(x => x.trim()).filter(Boolean).slice(0, VIEWER_SERIES.length);
  const shown = [], hidden = [], tooLong = [];
  phrases.forEach(label => {
    const q = label.toLowerCase().split(/\s+/);
    if (q.length > 5) { tooLong.push(label); return; }
    const counts = docs.map(x => {
      let c = 0;
      x.sents.forEach(toks => { for (let i = 0; i + q.length <= toks.length; i++) if (q.every((w, j) => toks[i + j] === w)) c++; });
      return c;
    });
    const df = counts.filter(c => c > 0).length;
    if (df < VIEWER_K) hidden.push({ label, df });
    else shown.push({ label, counts, values: counts.map((c, i) => docs[i].words ? c / docs[i].words : 0) });
  });
  return `
    <p class="rubric" style="margin-top:24px">${t('Example on the sample data', 'Ukázka na ukázkových datech')}</p>
    <p class="hint">${t(`The sample has only issues from 1905, so the axis shows issues instead of years. The threshold is lowered to k = ${VIEWER_K} (proposal: 5), otherwise nothing would pass. Several phrases can be compared, separated by commas.`,
                         `Ukázková data mají jen čísla z roku 1905, proto osa ukazuje čísla místo let. Práh je snížený na k = ${VIEWER_K} (návrh: 5), jinak by neprošlo nic. Porovnat lze víc spojení oddělených čárkou.`)}</p>
    <form class="viewer-form" data-viewer-form>
      <div class="param"><label for="viewer-q">${t('Phrases (1–5 words each, comma-separated)', 'Spojení (každé 1–5 slov, oddělená čárkou)')}</label><input type="text" id="viewer-q" value="${esc(v.q)}" placeholder="${t('e.g. absorpční spektrum, český akademie', 'např. absorpční spektrum, český akademie')}"></div>
      <div class="param"><label for="viewer-unit">${t('Match', 'Hledat')}</label><select id="viewer-unit"><option value="lemma"${v.unit === 'lemma' ? ' selected' : ''}>${t('Lemmas', 'Lemmata')}</option><option value="lc"${v.unit === 'lc' ? ' selected' : ''}>${t('Word forms', 'Tvary')}</option></select></div>
      <button class="btn btn-primary" type="submit">${t('Show', 'Zobrazit')}</button>
    </form>
    ${suggestions.length ? `<p class="hint">${t('Phrases that pass the threshold (click to add):', 'Spojení, která prahem projdou (kliknutím přidat):')} ${suggestions.map(g => `<button class="btn btn-sm" type="button" data-viewer-q="${esc(g)}">${esc(g)}</button>`).join(' ')}</p>` : ''}
    ${tooLong.length ? `<p class="warn">${t('At most 5 words per phrase:', 'Nejvýš 5 slov na spojení:')} ${esc(tooLong.join(', '))}</p>` : ''}
    ${hidden.map(h => `<p class="warn">${t(`"${esc(h.label)}" occurs in ${h.df} of ${docs.length} documents, fewer than k = ${VIEWER_K}. The viewer does not show it; otherwise a query for a whole sentence would confirm that it exists in the corpus.`,
                                         `„${esc(h.label)}“ je v ${h.df} z ${docs.length} dokumentů, tedy v méně než k = ${VIEWER_K}. Prohlížeč ho neukáže; jinak by dotaz na celou větu potvrdil, že v korpusu existuje.`)}</p>`).join('')}
    ${shown.length ? viewerChart(docs, shown) : ''}
    <p class="hint">${t(`Index state: sample data, ${DOCS.length} issues, ${fmt(pages)} pages, ${fmt(words)} words.`, `Stav indexu: ukázková data, ${DOCS.length} čísel, ${fmt(pages)} stran, ${fmt(words)} slov.`)}</p>`;
}

// ================================================================ events

function setView(view) {
  state.view = (view === 'overview' || view === 'manifest' || view === 'rules' || view === 'full' || DTFS.some(d => d.key === view)) ? view : 'overview';
  render();
  window.scrollTo(0, 0);
}
document.addEventListener('click', e => {
  const v = e.target.closest('[data-view]');
  if (v) { e.preventDefault(); history.replaceState(null, '', '#' + v.dataset.view); setView(v.dataset.view); return; }
  if (e.target.closest('[data-toggle-text]')) { state.textExpanded = !state.textExpanded; render(); return; }
  if (e.target.closest('[data-zip-view]')) { state.zipView = true; render(); return; }
  // Popup se zavře křížkem nebo kliknutím mimo okno (na pozadí).
  if (e.target.matches('.modal-backdrop') || e.target.closest('.zip-close')) { state.zipView = false; render(); return; }
  const vq = e.target.closest('[data-viewer-q]');
  if (vq) {
    const list = state.viewer.q.split(',').map(x => x.trim()).filter(Boolean);
    if (!list.includes(vq.dataset.viewerQ)) list.push(vq.dataset.viewerQ);
    state.viewer.q = list.join(', ');
    render(); return;
  }
  const ss = e.target.closest('[data-syn-sel]');
  if (ss) { state.synSel = state.synSel === ss.dataset.synSel ? null : ss.dataset.synSel; render(); return; }
  const ft = e.target.closest('[data-full-tab]');
  if (ft) { state.fullTab = ft.dataset.fullTab; render(); return; }
  const ps = e.target.closest('[data-pos-sel]');
  if (ps) { state.posSel = state.posSel === ps.dataset.posSel ? null : ps.dataset.posSel; render(); return; }
  const dl = e.target.closest('[data-download]');
  if (dl) { const d = DTFS.find(x => x.key === dl.dataset.download); d.zip || d.selection ? downloadZip(d) : downloadCsv(d); }
});
function onParam(e) {
  const el = e.target;
  if (el.dataset.source === 'doc') { state.doc = el.value; state.page = currentDoc().pages[0].n; render(); return; }
  if (el.dataset.source === 'page') { state.page = +el.value; render(); return; }
  if (el.dataset.manifestFmt !== undefined) { state.manifestFmt = el.value; render(); return; }
  if (!el.dataset.dtf) return;
  const def = DTFS.find(d => d.key === el.dataset.dtf).params.find(p => p.id === el.dataset.param);
  let v = def.type === 'checkbox' ? el.checked : def.type === 'number' || def.type === 'range' ? +el.value : el.value.trim();
  if (def.type === 'number') v = Math.max(def.min, Math.min(def.max, v || def.min));
  state.params[el.dataset.dtf][el.dataset.param] = v;
  const focusId = el.id, caret = el.type === 'text' ? el.selectionStart : null;
  render();
  const again = document.getElementById(focusId);
  if (again && el.type === 'text') { again.focus(); again.setSelectionRange(caret, caret); }
}
document.addEventListener('submit', e => {
  if (!e.target.matches('[data-viewer-form]')) return;
  e.preventDefault();
  state.viewer = { q: document.getElementById('viewer-q').value, unit: document.getElementById('viewer-unit').value };
  render();
});

// Posuvník se během tažení nepřekresluje (ztratil by úchop), jen ukazuje hodnotu.
document.addEventListener('change', e => { if (e.target.type !== 'text') onParam(e); });
document.addEventListener('input', e => {
  if (e.target.type === 'text') onParam(e);
  if (e.target.type === 'range') e.target.nextElementSibling.textContent = e.target.value;
});

function downloadCsv(dtf) {
  const res = dtf.compute(state.params[dtf.key]);
  const cell = v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v);
  const csv = [res.columns, ...res.rows].map(r => r.map(cell).join(',')).join('\n') + '\n';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `dtf-${dtf.key}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ---------------------------------------------------------------- jazyk, téma, sidebar (vzor z design/index.html)
function applyLang() {
  document.documentElement.lang = LANG;
  document.title = t('Derived Text Formats', 'Odvozené textové formáty');
  document.getElementById('wordmark').textContent = t('Derived text formats', 'Odvozené textové formáty');
  const btn = document.getElementById('lang-toggle');
  btn.textContent = LANG === 'cs' ? 'EN' : 'CS';
  btn.title = t('Česky (Alt+L)', 'English (Alt+L)');
  applyTheme(document.documentElement.getAttribute('data-theme') || 'light');
  applySidebarCollapsed(document.getElementById('sidebar').classList.contains('collapsed'));
}
function toggleLang() {
  LANG = LANG === 'cs' ? 'en' : 'cs';
  try { localStorage.setItem('dtf-lang', LANG); } catch (e) {}
  applyLang();
  render();
}
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const toggle = document.getElementById('theme-toggle');
  const label = theme === 'dark' ? t('Light mode', 'Světlý režim') : t('Dark mode', 'Tmavý režim');
  toggle.title = `${label} (Alt+T)`;
  toggle.setAttribute('aria-label', label);
}
function toggleTheme() {
  const next = (document.documentElement.getAttribute('data-theme') || 'light') === 'light' ? 'dark' : 'light';
  applyTheme(next);
  try { localStorage.setItem('dtf-theme', next); } catch (e) {}
}
function applySidebarCollapsed(collapsed) {
  document.getElementById('sidebar').classList.toggle('collapsed', collapsed);
  if (!collapsed) document.documentElement.removeAttribute('data-sidebar');
  const btn = document.getElementById('sidebar-toggle');
  btn.textContent = collapsed ? '›' : '‹';
  btn.title = (collapsed ? t('Show sidebar', 'Zobrazit postranní panel') : t('Hide sidebar', 'Skrýt postranní panel')) + ' (Alt+S)';
}
function toggleSidebar() {
  const collapsed = !document.getElementById('sidebar').classList.contains('collapsed');
  applySidebarCollapsed(collapsed);
  try { localStorage.setItem('dtf-sidebar-collapsed', collapsed ? '1' : '0'); } catch (e) {}
}
document.getElementById('lang-toggle').addEventListener('click', toggleLang);
document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
document.getElementById('sidebar-toggle').addEventListener('click', toggleSidebar);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && state.zipView) { state.zipView = false; render(); return; }
  if (!e.altKey) return;
  if (e.key === 't' || e.key === 'T') { e.preventDefault(); toggleTheme(); }
  if (e.key === 'l' || e.key === 'L') { e.preventDefault(); toggleLang(); }
  if (e.key === 's' || e.key === 'S') { e.preventDefault(); toggleSidebar(); }
});

function boot() {
  loadDocs();
  if (DOCS[0]) { state.doc = DOCS[0].id; state.page = DOCS[0].pages[0].n; }
  window.addEventListener('hashchange', () => { if (location.hash.slice(1) !== state.view) setView(location.hash.slice(1)); });
  setView(location.hash.slice(1) || 'overview');
}

applySidebarCollapsed(document.documentElement.getAttribute('data-sidebar') === 'collapsed');
applyLang();
document.getElementById('loader-text').textContent = t('Loading sample data…', 'Načítám ukázková data…');
// Krátce počkat, ať prohlížeč loader vykreslí, než začne parsovat data.
// setTimeout, ne requestAnimationFrame: ten v nezobrazené záložce neběží vůbec.
setTimeout(() => {
  const script = document.createElement('script');
  script.src = 'data.js';
  script.onload = () => setTimeout(boot, 0);
  script.onerror = () => { document.getElementById('loader-text').textContent = t('Could not load data.js.', 'Nepodařilo se načíst data.js.'); };
  document.head.appendChild(script);
}, 30);
</script>
</body>
